<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tour 360</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #panorama { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="panorama"></div>
<script>
pannellum.viewer('panorama', {
  "default": {
    "firstScene": "escena1",
    "autoLoad": true,
    "sceneFadeDuration": 1000
  },
  "scenes": {
    "escena1": {
      "title": "Ingreso",
      "type": "equirectangular",
      "panorama": "fotos/foto1.jpg",
      "hotSpots": [
        { "pitch": 0, "yaw": 90, "type": "scene", "text": "Ir a escena 2", "sceneId": "escena2" }
      ]
    },
    "escena2": {
      "title": "Escena 2",
      "type": "equirectangular",
      "panorama": "fotos/foto2.jpg",
      "hotSpots": [
        { "pitch": 0, "yaw": -90, "type": "scene", "text": "Volver a escena 1", "sceneId": "escena1" },
        { "pitch": 0, "yaw": 90, "type": "scene", "text": "Ir a escena 3", "sceneId": "escena3" }
      ]
    },
    "escena3": {
      "title": "Escena 3",
      "type": "equirectangular",
      "panorama": "fotos/foto3.jpg",
      "hotSpots": [
        { "pitch": 0, "yaw": -90, "type": "scene", "text": "Volver a escena 2", "sceneId": "escena2" },
        { "pitch": 0, "yaw": 90, "type": "scene", "text": "Ir a escena 4", "sceneId": "escena4" }
      ]
    },
    "escena4": {
      "title": "Escena 4",
      "type": "equirectangular",
      "panorama": "fotos/foto4.jpg",
      "hotSpots": [
        { "pitch": 0, "yaw": -90, "type": "scene", "text": "Volver a escena 3", "sceneId": "escena3" },
        { "pitch": 0, "yaw": 90, "type": "scene", "text": "Ir a escena 5", "sceneId": "escena5" }
      ]
    },
    "escena5": {
      "title": "Escena 5",
      "type": "equirectangular",
      "panorama": "fotos/foto5.jpg",
      "hotSpots": [
        { "pitch": 0, "yaw": -90, "type": "scene", "text": "Volver a escena 4", "sceneId": "escena4" },
        { "pitch": 0, "yaw": 90, "type": "scene", "text": "Ir a escena 6", "sceneId": "escena6" }
      ]
    },
    "escena6": {
      "title": "Escena 6",
      "type": "equirectangular",
      "panorama": "fotos/foto6.jpg",
      "hotSpots": [
        { "pitch": 0, "yaw": -90, "type": "scene", "text": "Volver a escena 5", "sceneId": "escena5" }
      ]
    }
  }
});
</script>
</body>
</html>
